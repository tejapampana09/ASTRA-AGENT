version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: astra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/astra_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgrespassword@postgres:5432/astra_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-litellm}
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      - LLM_API_KEY=${LLM_API_KEY}
      - WORKSPACE_BASE_DIR=/app/workspaces
    volumes:
      - ./backend/app:/app/app
      - workspace_data:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: astra-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/astra_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      - LLM_API_KEY=${LLM_API_KEY}
      - WORKSPACE_BASE_DIR=/app/workspaces
    volumes:
      - ./backend/app:/app/app
      - workspace_data:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  workspace_data:
